name: Build and Publish Templates

# `main` publishes the stable channel (npm dist-tag `latest`); `beta` publishes prereleases
# (`X.Y.Z-beta.N`, dist-tag `beta`). Each channel is type-checked against the SheetXL release on the
# same dist-tag, because that is the script editor that will load it.
on:
  push:
    branches: [main, beta]
    paths:
      - 'templates/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [main, beta]
    paths:
      - 'templates/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/publish.yml'
  # Actions tab > Run workflow: publishes a new version even without template changes.
  workflow_dispatch:

env:
  # A pull request is checked against the channel of the branch it targets.
  CHANNEL: ${{ (github.base_ref || github.ref_name) == 'beta' && 'beta' || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # --no-save leaves package.json and the lockfile as committed.
      - name: Install SheetXL for this channel
        run: |
          npm install --no-save "@sheetxl/sdk@$CHANNEL" "@sheetxl/primitives@$CHANNEL"
          npm ls @sheetxl/sdk @sheetxl/primitives

      - name: Type-check templates
        run: npm run typecheck

      - name: Build manifest
        run: npm run build

      - name: Validate generated files
        run: |
          if [ ! -f "dist/manifest.json" ]; then
            echo "Error: dist/manifest.json was not generated"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const entries = JSON.parse(fs.readFileSync("dist/manifest.json", "utf-8"));
            if (!Array.isArray(entries) || entries.length === 0) throw new Error("manifest has no entries");
            for (const e of entries) {
              if (!fs.existsSync("dist/" + e.path)) throw new Error("missing file " + e.path);
            }
            console.log("Manifest has " + entries.length + " templates");
          '
          echo "Generated files validated"

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing (OIDC); no npm token secret.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # Full history and tags, so the change check can diff against the last release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build manifest
        run: npm run build

      - name: Get current version
        id: current_version
        run: echo "version=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Check if version should be bumped
        id: version_check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Last tag: ${LAST_TAG:-<none>}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual publish requested"
            SHOULD_PUBLISH=true
          elif [[ "$COMMIT_MESSAGE" == *"[publish]"* ]]; then
            echo "Force publish requested in commit message"
            SHOULD_PUBLISH=true
          elif [[ -z "$LAST_TAG" ]] || ! git diff --quiet "$LAST_TAG" HEAD -- templates/ config/; then
            echo "Template changes detected since ${LAST_TAG:-the first commit}"
            SHOULD_PUBLISH=true
          else
            echo "No template changes since $LAST_TAG"
            SHOULD_PUBLISH=false
          fi
          echo "should_publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT

      # beta: 0.1.23 -> 0.1.24-beta.0 -> 0.1.24-beta.1. main: 0.1.23 -> 0.1.24, and a prerelease
      # merged in from beta (0.1.24-beta.3) -> 0.1.24.
      # The version is written locally, published, and only then committed and tagged, so a failed
      # publish leaves no tag behind and the next run retries the same version.
      - name: Update version
        id: new_version
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          if [[ "$CHANNEL" == "beta" ]]; then
            npm version prerelease --preid=beta --no-git-tag-version
          else
            npm version patch --no-git-tag-version
          fi
          VERSION=$(npm pkg get version | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version from ${{ steps.current_version.outputs.version }} to $VERSION ($CHANNEL)"

      # --tag is always explicit: npm assigns `latest` to any publish without one, prerelease or not.
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public --tag "$CHANNEL"

      - name: Commit version and tag release
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.new_version.outputs.version }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "Bump version to $VERSION [skip ci]"
          git push
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.new_version.outputs.version }}"
          if [[ "$CHANNEL" == "beta" ]]; then
            RELEASE_FLAGS="--prerelease --latest=false"
          else
            RELEASE_FLAGS="--latest"
          fi
          gh release create "v$VERSION" $RELEASE_FLAGS \
            --title "Release v$VERSION" \
            --notes "Updated SheetXL scripting templates.

          Manifest: https://unpkg.com/@sheetxl/templates-scripting@$VERSION/dist/manifest.json

          \`\`\`bash
          npm install @sheetxl/templates-scripting@$VERSION
          \`\`\`

          See the [commit history](https://github.com/sheetxl/templates-scripting/commits/v$VERSION) for details."
